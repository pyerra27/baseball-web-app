name: Security audit

# Weekly check for newly published advisories. A new advisory fails the run, and
# GitHub emails whoever last changed the schedule. npm audit skips dev
# dependencies because they never ship in the site's bundle.
on:
  schedule:
    - cron: "0 12 * * 1"  # Mondays at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit requirements.lock
        run: pip-audit -r backend/requirements.lock --no-deps --disable-pip

  frontend:
    name: Frontend production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
